syntax = "proto3";

package planner_sandbox;

import "intrinsic/motion_planning/proto/v1/motion_planner_config.proto";
import "intrinsic/motion_planning/proto/v1/motion_specification.proto";
import "intrinsic/motion_planning/proto/v1/robot_specification.proto";
import "intrinsic/world/proto/world_updates.proto";

// The world the planner runs in. Relative paths are resolved against the
// directory of the scenario file.
message Scene {
  oneof source {
    // A serialized world (as produced by the sdf_world Bazel rule in the main
    // workspace).
    string gzf = 1;
    // An SDF world. `model://` URIs are resolved against the asset roots
    // (the intrinsic-core checkout and --asset_root).
    string sdf = 2;
  }

  // For `sdf`: create group ids for models (sdf_world's generate_group_ids).
  bool generate_group_ids = 3;

  // intrinsic_proto.world.WorldUpdates text protos applied in order, e.g. to
  // set the robot tip, IK solver or collision exclusions.
  repeated string world_updates_files = 5;

  // Updates applied after `world_updates_files`.
  intrinsic_proto.world.WorldUpdates world_updates = 6;
}

message Motion {
  string name = 1;

  intrinsic_proto.motion_planning.v1.MotionSpecification motion_specification =
      2;

  intrinsic_proto.motion_planning.v1.MotionPlannerConfiguration
      motion_planner_config = 3;

  // Only run path planning (MotionPlanner::PlanPath), no trajectory.
  bool path_only = 4;
}

message Scenario {
  Scene scene = 1;

  // Name of the robot object in the world (e.g. "my_robot").
  string robot = 2;

  // Initial joint positions. Defaults to the positions stored in the world.
  repeated double start_joint_positions = 3;

  // Defaults to a reference to `robot` by name.
  intrinsic_proto.motion_planning.v1.RobotSpecification robot_specification =
      4;

  // Planned in order. Each motion starts where the previous one ended.
  repeated Motion motions = 5;
}
